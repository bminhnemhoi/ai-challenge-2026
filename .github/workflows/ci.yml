# Chạy trên mọi push và mọi pull request.
#
# Cố ý KHÔNG cài torch/transformers: bộ test không cần chỉ mục SigLIP-2, nên
# `requirements-dev.txt` chỉ có 5 gói và cả job xong trong khoảng một phút.
# Một CI chạy hai phút thì người ta còn chờ; chạy hai mươi phút thì người ta bỏ qua.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Đẩy commit mới lên cùng một PR thì huỷ lượt chạy cũ, khỏi xếp hàng vô ích.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Cả đội làm trên Windows, còn CI mặc định là Linux — chạy cả hai vì
        # repo này đã ăn đủ hai lỗi chỉ xuất hiện trên Windows: console cp1252
        # nuốt tiếng Việt, và PowerShell làm hỏng UTF-8 khi ghi file.
        os: [ubuntu-latest, windows-latest]
        python: ['3.12']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      # 23 test đối chiếu bản JavaScript của bộ phân bổ với bản Python. Không có
      # node thì chúng TỰ BỎ QUA chứ không đỏ — đúng loại lỗ hổng khiến người ta
      # tưởng đã kiểm mà thật ra chưa.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cài thư viện
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # Ba nhom, chay het: 186 + 214 + 15 = 415. Nhom task2_vqa nam ngoai thu muc
      # tests/ nen rat de bi bo quen — do la ly do liet ke ro tung duong dan.
      - name: Chạy test
        run: python -m pytest tests src/task3_trake/tests src/task2_vqa -q

      - name: Không được có test nào bị bỏ qua vì thiếu công cụ
        shell: bash
        run: |
          out=$(python -m pytest tests src/task3_trake/tests src/task2_vqa -q 2>&1 | tail -3)
          echo "$out"
          if echo "$out" | grep -qi "skipped"; then
            echo "::error::Có test bị bỏ qua — thường là thiếu node. Bỏ qua âm thầm nghĩa là không ai kiểm nữa."
            exit 1
          fi

  guard:
    name: Không rò rỉ khoá và đáp án
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 vì bước dưới soi CẢ LỊCH SỬ, không chỉ cây hiện tại. Một
      # khoá bị commit rồi xoá ở commit sau thì vẫn nằm trong lịch sử và vẫn đọc
      # được — `git grep` trần sẽ bỏ lọt đúng trường hợp nguy hiểm nhất.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Repo này CÔNG KHAI. Ba thứ tuyệt đối không được commit, và cả ba đều đã
      # suýt lọt một lần: khoá API, thư mục vòng thi thật, và bản đồ đáp án.
      # Bo chot chan dau tien chi tim 'AIza...' bang git grep, va no DE LOT mot
      # token HuggingFace nam trong repo nhieu tuan — vi token do bi cat lam hai
      # manh roi noi lai, nen khong bieu thuc chinh quy nao khop. scripts/quet_bi_mat.py
      # dan lai chuoi truoc khi so khop, va quet ca lich su.
      - name: Không có chuỗi bí mật — cả cây hiện tại lẫn lịch sử
        run: python scripts/quet_bi_mat.py --lich-su

      - name: Không commit dữ liệu vòng thi thật
        run: |
          bad=$(git ls-files | grep -E '^(round[0-9]|vongthi)|picks_verified\.txt|sharp_questions\.json' || true)
          if [ -n "$bad" ]; then
            echo "$bad"
            echo "::error::Đây là đề của BTC hoặc đáp án của đội — repo công khai thì không được commit."
            exit 1
          fi
          echo "Sạch."

      - name: File .env không bao giờ được theo dõi
        run: |
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "::error::.env đang bị git theo dõi."
            exit 1
          fi
          echo "Sạch."
