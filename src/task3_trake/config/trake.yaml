# CHRONOS / TRAKE default parameters (spec section 11).
# Principle: every parameter here is also adjustable at query time via the
# API/UI — this file only sets the defaults.

encoder:            siglip2-so400m       # fallback: beit3-large, clip-vit-l14
embedding_dim:      1152
dtype:              float16

scoring:
  normalize:        zscore_per_row
  mode:             balanced          # visual | balanced | text_heavy | speech
  # An explicit `weights` block OVERRIDES `mode` (and is itself overridden by
  # a per-request mode or weights).  Left commented out so that editing `mode`
  # above does what it looks like it does; uncomment only to run a custom mix.
  # weights:
  #   visual:       0.70
  #   ocr:          0.15
  #   asr:          0.15

alignment:
  align_mode:       ordered
  # `auto` derives lambda from the estimated event tempo AND the score scale
  # (see alignment.adaptive_lambda).  An explicit value here is absolute, in
  # the score matrix's own units.
  lambda:           auto
  # bounds for the AUTO path, in units of score standard deviation per
  # keyframe.  With the mandated per-row z-scoring one sigma is 1.0, so these
  # are also the absolute bounds in practice; the spec's raw-cosine numbers
  # [0.0005, 0.02] correspond to this band once rescaled.
  lambda_bounds:    [0.005, 0.2]
  lambda_kappa:     0.5                  # tempo constant: lambda ~ kappa / gap
  min_gap:          2
  # earliness prior, in units of score standard deviation: a chain starting at
  # the very end of the video pays this many sigma.  Applied only when the
  # query asks for the FIRST occurrence.  The spec's 0.05 was a raw-cosine
  # figure and is inert against z-scored scores.
  #
  # Chosen from a sweep over 250 queries across 5 independently generated
  # corpora (Seq Acc / accuracy on queries the prior cannot help):
  #   0.0 -> 75.6% / 97.1%    2.0 -> 83.2% / 96.2%   <- knee of the curve
  #   1.0 -> 80.8% / 96.2%    4.0 -> 84.0% / 94.2%   (+0.8 for -2.0, bad trade)
  #   0.5 -> 79.2% / 97.1%    8.0 -> 76.4% / 86.5%   (collapse)
  earliness_mu:     2.0
  topk_videos:      20

llm:
  decomposer:       gpt-4o-mini          # latency over quality
  timeout_ms:       2000
  fallback:         rule_based_split     # split on "E1:", "E2:", ";"

verify:
  enabled:          false                # manual toggle on the UI
  vlm:              qwen2-vl-7b
  topk_verify:      3
